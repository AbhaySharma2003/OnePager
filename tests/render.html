<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../web/resume/resume.css">
<style>body{margin:0;background:#fff}</style></head><body><div id="root" class="op-print-root"></div>
<script type="module">
import {renderResume,checkFit} from '../web/resume/render.js';
const f=new URLSearchParams(location.search).get('f');
const d=await (await fetch(f)).json();
await document.fonts.ready;
const page=renderResume(d,document.getElementById('root'),{highlightLabels:true});
await document.fonts.ready;
window.__fit=checkFit(page);
window.__done=true;
</script></body></html>
